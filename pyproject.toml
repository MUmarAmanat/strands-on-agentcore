[project]
name = "reminder-agent"
version = "0.1.0"
description = "Daily task reminder agent on Strands, Amazon Bedrock and AgentCore Runtime"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "bedrock-agentcore",
    "pydantic>=2.0",
    "google-auth>=2.29",
    "google-api-python-client>=2.130",
    "boto3>=1.34",
    "tzdata>=2026.6",
    "aws-opentelemetry-distro>=0.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reminder_agent"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
